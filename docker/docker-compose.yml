# GamesmanROS 2 dev container.
#
#   docker compose -f docker/docker-compose.yml run --rm dev
#
# Defaults here work on every host OS. Linux users should additionally
# uncomment the network_mode / devices lines below — see docs/SETUP.md.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: gamesmanros:humble
    working_dir: /ws
    volumes:
      - ../ros2_ws:/ws
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    # Shared-memory DDS transport between containers on the same host.
    ipc: host
    stdin_open: true
    tty: true

    # --- Linux hosts only -------------------------------------------------
    # network_mode: host        # DDS discovery to the Pi over the LAN
    # devices:
    #   - /dev/video0:/dev/video0   # USB camera passthrough
    # volumes:
    #   - ../ros2_ws:/ws
    #   - /tmp/.X11-unix:/tmp/.X11-unix:rw
